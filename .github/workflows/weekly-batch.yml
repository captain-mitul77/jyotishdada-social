name: Weekly batch (for YouTube Shorts scheduling)

on:
  schedule:
    - cron: "7 11 * * 0"        # Sundays 11:07 UTC = 16:37 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE: ${{ vars.API_BASE || 'https://api.jyotishdada.com' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://jyotishdada.com' }}
      CITY_SLUG: ${{ vars.CITY_SLUG || 'delhi' }}
      DAYS: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0
          pip install -r requirements.txt
      - run: python src/make_week.py
      - uses: actions/upload-artifact@v4
        with:
          name: week-batch
          path: out/
          retention-days: 14
